name: Publicar release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lilith-release
  cancel-in-progress: false

jobs:
  probar-instalador-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Probar herramientas atómicas en Windows
        shell: powershell
        run: go test -tags=grammar_set_core ./internal/tools ./internal/shell

      - name: Probar instalador con Windows PowerShell 5.1
        shell: powershell
        run: .\.github\scripts\test_install_ps1.ps1

  release:
    needs: probar-instalador-windows
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Descargar dependencias Go
        run: go mod download

      - name: Leer versión del proyecto
        id: version
        shell: bash
        run: |
          VERSION="$(go run ./cmd/build version)"
          TAG="v${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publicando Lilith $TAG"

      - name: Verificar que la versión sea nueva
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya existe. Cambia internal/version/version.go antes de publicar." >&2
            exit 1
          fi

      - name: Ejecutar pruebas y análisis estático
        run: |
          go test -tags=grammar_set_core ./...
          go vet -tags=grammar_set_core ./...

      - name: Verificar binario estático con gramáticas embebidas
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -tags=grammar_set_core -trimpath -buildvcs=false -o dist/li-static-check ./cmd/li
          if command -v ldd >/dev/null 2>&1 && ldd dist/li-static-check 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo "El binario de comprobación tiene dependencias dinámicas inesperadas:" >&2
            ldd dist/li-static-check >&2 || true
            exit 1
          fi
          rm -f dist/li-static-check

      - name: Probar instalador Linux y compilación Termux
        run: |
          sh -n install.sh
          python3 .github/scripts/test_install_sh.py

      - name: Compilar binarios
        run: go run ./cmd/build build

      - name: Generar sumas SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum li-* > SHA256SUMS.txt

      - name: Detectar release anterior
        id: previous
        shell: bash
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generando cambios desde $PREVIOUS_TAG"
          else
            echo "No existe un tag anterior; se documentará la primera versión."
          fi

      - name: Generar notas del release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 .github/scripts/release_notes.py \
            --tag "$TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --repository "$REPOSITORY" \
            --output dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Lilith $TAG" \
            --notes-file dist/RELEASE_NOTES.md
